<!DOCTYPE html>
<html>
  <head>
    <title>Crusader - Battles</title>
    <meta charset="utf-8" />
    <meta name="description" content="Progressive web app to keep track of Warhammer 40,000 crusades" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://crusader.facerix.com/battles/" />
    <meta property="og:title" content="Crusader - Manage Battles" />
    <meta property="og:description" content="Progressive web app to keep track of Warhammer 40,000 crusades" />
    <meta property="og:url" content="https://crusader.facerix.com/battles/" />
    <meta property="og:type" content="website" />

    <link rel="icon" href="/sword.svg" type="image/svg" />
    <link rel="icon" href="/icon512_maskable.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon512_rounded.png" sizes="512x512" />

    <link rel="stylesheet" href="/main.css" type="text/css" charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      main {
        align-items: center;
        gap: 1.5em;

        .battle-list {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>

  <body class="fill-height">
    <site-header title="Battle Reports"></site-header>
    <main>
      <div class="u-flex battle-list">
        <button href="/battle/?new" id="btnNew">
          <img src="/images/Fast-Attack.svg" alt="create" />
          <span class="caption">Start new battle</span>
        </button>
      </div>
    </main>

    <new-battle-modal></new-battle-modal>
  </body>
  <script src="battles.js" type="module"></script>
</html>
