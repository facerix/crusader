<!DOCTYPE html>
<html>
  <head>
    <title>Crusader - Battles</title>
    <meta charset="utf-8" />
    <meta name="description" content="Progressive web app to keep track of Warhammer 40,000 crusades" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://crusader.facerix.com/battles/" />
    <meta property="og:title" content="Crusader - Manage Battles" />
    <meta property="og:description" content="Progressive web app to keep track of Warhammer 40,000 crusades" />
    <meta property="og:url" content="https://crusader.facerix.com/battles/" />
    <meta property="og:type" content="website" />

    <link rel="icon" href="/sword.svg" type="image/svg" />
    <link rel="icon" href="/icon512_maskable.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon512_rounded.png" sizes="512x512" />

    <link rel="stylesheet" href="/main.css" type="text/css" charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      main {
        align-items: center;
        gap: 1.5em;

        .battle-list {
          flex-direction: column;
          align-items: center;
        }
        
      }

      battle-card {
        margin-top: 1em;
        border: 2px outset #442222;
        padding: 1rem;
        border-radius: 0.5rem;
        width: 32rem;

        --tw-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --tw-shadow-colored: 0 4px 6px -1px var(--tw-shadow-color), 0 2px 4px -2px var(--tw-shadow-color);
        box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);

        .dateLine {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          margin-bottom: 1rem;;

          img {
            max-height: 1.25rem;
          }
        }

        .details {
          margin-left: auto;
          border-color: transparent;
        }

        .results {
          display: flex;
          justify-content: space-between;
          margin-bottom: 1.5rem;

          .player {
            text-align: center;
            flex: 1 1 0%;

            .name {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.5rem;
            }
            h3, p {
              margin: 0;
            }
          }

          .vs {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.5rem;
            line-height: 2rem;
            padding-left: 1rem;
            padding-right: 1rem;
          }

          .score {
            font-weight: 700;
            font-size: 1.5rem;
            line-height: 2rem;
            margin-top: 0.5rem;
          }
        }

        img {
          width: 2em;
        }
      }
    </style>
  </head>

  <body class="fill-height">
    <site-header title="Battle Reports"></site-header>
    <main>
      <div class="u-flex battle-list">
        <button id="btnNew">
          <img src="/images/Fast-Attack.svg" alt="create" />
          <span class="caption">Start new battle</span>
        </button>
      </div>
    </main>

    <!-- <dialog id="roster-modal">
      <roster-editor></roster-editor>
    </dialog> -->
  </body>
  <script src="battles.js" type="module"></script>
</html>
